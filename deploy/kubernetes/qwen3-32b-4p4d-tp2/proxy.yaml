apiVersion: v1
kind: Service
metadata:
  name: pd-proxy
  namespace: __NAMESPACE__
spec:
  selector:
    app.kubernetes.io/name: pd-proxy
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-proxy
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pd-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pd-proxy
      annotations:
        pd.openai.com/restarted-at: "__RESTART_TOKEN__"
        pd.openai.com/proxy-code-sha256: "__PROXY_CODE_SHA256__"
    spec:
      nodeName: "__PREFILL_NODE__"
      containers:
        - name: proxy
          image: "__VLLM_IMAGE__"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /opt/pd-launcher/launch_proxy.sh
          env:
            - {name: PROXY_VARIANT, value: "__PROXY_VARIANT__"}
            - {name: PROXY_CODE_SHA256, value: "__PROXY_CODE_SHA256__"}
            - {name: KV_AWARE_ROUTING, value: "__KV_AWARE_ROUTING__"}
            - {name: PROXY_DECODER_COUNT, value: "__PROXY_DECODER_COUNT__"}
            - {name: SESSION_LRU_SIZE, value: "__SESSION_LRU_SIZE__"}
            - {name: PREFIX_HASH_CHARS, value: "__PREFIX_HASH_CHARS__"}
            - {name: PREFIX_LRU_SIZE, value: "__PREFIX_LRU_SIZE__"}
            - {name: PREFILL_ACTIVE_TOKEN_WEIGHT, value: "__PREFILL_ACTIVE_TOKEN_WEIGHT__"}
            - {name: AFFINITY_OVERLOAD_FACTOR, value: "__AFFINITY_OVERLOAD_FACTOR__"}
            - {name: AFFINITY_MISS_UNBIND_THRESHOLD, value: "__AFFINITY_MISS_UNBIND_THRESHOLD__"}
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - "1"
            - --log-level
            - INFO
            - --prefiller-hosts
            - pd-prefill-0.pd-prefill
            - pd-prefill-1.pd-prefill
            - pd-prefill-2.pd-prefill
            - pd-prefill-3.pd-prefill
            - --prefiller-ports
            - "7100"
            - "7100"
            - "7100"
            - "7100"
          ports:
            - {name: http, containerPort: 8000}
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 8000
            periodSeconds: 3
            failureThreshold: 100
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8000
            periodSeconds: 15
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - {name: proxy-code, mountPath: /opt/pd-proxy, readOnly: true}
            - {name: launcher, mountPath: /opt/pd-launcher, readOnly: true}
      volumes:
        - name: proxy-code
          configMap:
            name: pd-proxy-code
        - name: launcher
          configMap:
            name: pd-launcher
            defaultMode: 0755
