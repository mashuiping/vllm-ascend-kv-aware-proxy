apiVersion: v1
kind: Service
metadata:
  name: pd-proxy
  namespace: __NAMESPACE__
spec:
  selector:
    app.kubernetes.io/name: pd-proxy
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pd-proxy
  namespace: __NAMESPACE__
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pd-proxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pd-proxy
      annotations:
        pd.openai.com/restarted-at: "__RESTART_TOKEN__"
    spec:
      nodeName: "__PREFILL_NODE__"
      containers:
        - name: proxy
          image: "__VLLM_IMAGE__"
          imagePullPolicy: IfNotPresent
          command:
            - /bin/bash
            - /opt/pd-launcher/launch_proxy.sh
          env:
            - {name: PROXY_VARIANT, value: "__PROXY_VARIANT__"}
            - {name: KV_AWARE_ROUTING, value: "__KV_AWARE_ROUTING__"}
            - {name: SESSION_LRU_SIZE, value: "__SESSION_LRU_SIZE__"}
            - {name: PREFIX_HASH_CHARS, value: "__PREFIX_HASH_CHARS__"}
            - {name: PREFIX_LRU_SIZE, value: "__PREFIX_LRU_SIZE__"}
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - "1"
            - --log-level
            - INFO
            - --prefiller-hosts
            - pd-prefill
            - pd-prefill
            - pd-prefill
            - pd-prefill
            - --prefiller-ports
            - "7100"
            - "7101"
            - "7102"
            - "7103"
            - --decoder-hosts
            - pd-decode
            - pd-decode
            - pd-decode
            - pd-decode
            - --decoder-ports
            - "7200"
            - "7201"
            - "7202"
            - "7203"
          ports:
            - {name: http, containerPort: 8000}
          startupProbe:
            httpGet:
              path: /healthcheck
              port: 8000
            periodSeconds: 3
            failureThreshold: 100
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8000
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8000
            periodSeconds: 15
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              cpu: "4"
              memory: 4Gi
          volumeMounts:
            - {name: proxy-code, mountPath: /opt/pd-proxy, readOnly: true}
            - {name: launcher, mountPath: /opt/pd-launcher, readOnly: true}
      volumes:
        - name: proxy-code
          configMap:
            name: pd-proxy-code
        - name: launcher
          configMap:
            name: pd-launcher
            defaultMode: 0755
