apiVersion: v1
kind: Service
metadata:
  name: pd-decode
  namespace: __NAMESPACE__
  labels:
    app.kubernetes.io/name: pd-decode
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: pd-decode
  ports:
    - {name: http, port: 7200, targetPort: 7200}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pd-decode
  namespace: __NAMESPACE__
spec:
  serviceName: pd-decode
  replicas: 4
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: pd-decode
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pd-decode
      annotations:
        pd.openai.com/restarted-at: "__RESTART_TOKEN__"
    spec:
      nodeName: "__DECODE_NODE__"
      terminationGracePeriodSeconds: 60
      containers:
        - name: decoder
          image: "__VLLM_IMAGE__"
          imagePullPolicy: IfNotPresent
          securityContext:
            privileged: true
          command: ["/bin/bash", "/opt/pd/launch_role.sh"]
          env:
            - {name: ROLE, value: "decode"}
            - {name: NIC_NAME, value: "__NIC_NAME__"}
            - {name: DEVICE_COUNT, value: "2"}
            - {name: INSTANCE_COUNT, value: "1"}
            - {name: TP_SIZE, value: "2"}
            - {name: PORT_START, value: "7200"}
            - {name: MOONCAKE_KV_PORT, value: "30200"}
            - {name: MODEL_PATH, value: "__MODEL_PATH__"}
            - {name: SERVED_MODEL_NAME, value: "__SERVED_MODEL_NAME__"}
            - {name: MAX_MODEL_LEN, value: "__MAX_MODEL_LEN__"}
            - {name: MAX_NUM_BATCHED_TOKENS, value: "__DECODE_MAX_BATCHED_TOKENS__"}
            - {name: MAX_NUM_SEQS, value: "__DECODE_MAX_NUM_SEQS__"}
            - {name: GPU_MEMORY_UTILIZATION, value: "__GPU_MEMORY_UTILIZATION__"}
            - {name: REASONING_PARSER, value: "__REASONING_PARSER__"}
          resources:
            requests:
              __NPU_RESOURCE__: "2"
            limits:
              __NPU_RESOURCE__: "2"
          startupProbe:
            exec:
              command: ["/bin/bash", "-ec", "test -f /tmp/pd-ready"]
            periodSeconds: 5
            failureThreshold: 720
          readinessProbe:
            exec:
              command: ["/bin/bash", "-ec", "test -f /tmp/pd-ready"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/bash", "-ec", "test -f /tmp/pd-ready"]
            periodSeconds: 15
            failureThreshold: 4
          volumeMounts:
            - {name: launcher, mountPath: /opt/pd, readOnly: true}
            - {name: models, mountPath: /models, readOnly: true}
            - {name: dcmi, mountPath: /usr/local/dcmi, readOnly: true}
            - {name: hccn-tool, mountPath: /usr/local/Ascend/driver/tools/hccn_tool, readOnly: true}
            - {name: npu-smi, mountPath: /usr/local/bin/npu-smi, readOnly: true}
            - {name: driver-lib64, mountPath: /usr/local/Ascend/driver/lib64, readOnly: true}
            - {name: driver-version, mountPath: /usr/local/Ascend/driver/version.info, readOnly: true}
            - {name: ascend-install-info, mountPath: /etc/ascend_install.info, readOnly: true}
            - {name: hccn-config, mountPath: /etc/hccn.conf, readOnly: true}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: launcher
          configMap:
            name: pd-launcher
            defaultMode: 0755
        - name: models
          hostPath:
            path: "__MODEL_HOST_PATH__"
            type: Directory
        - name: dcmi
          hostPath:
            path: /usr/local/dcmi
            type: Directory
        - name: hccn-tool
          hostPath:
            path: /usr/local/Ascend/driver/tools/hccn_tool
            type: File
        - name: npu-smi
          hostPath:
            path: /usr/local/bin/npu-smi
            type: File
        - name: driver-lib64
          hostPath:
            path: /usr/local/Ascend/driver/lib64
            type: Directory
        - name: driver-version
          hostPath:
            path: /usr/local/Ascend/driver/version.info
            type: File
        - name: ascend-install-info
          hostPath:
            path: /etc/ascend_install.info
            type: File
        - name: hccn-config
          hostPath:
            path: /etc/hccn.conf
            type: File
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 16Gi
